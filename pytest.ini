[pytest]
# Pytest configuration for IRC HackathonProject

# Add src directory to Python path for imports
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers for different test types
markers =
    unit: Unit tests that don't require network connections
    integration: Integration tests that may require network access
    slow: Tests that take significant time to complete
